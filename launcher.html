<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>BDD Activités — Launcher</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }
header {
  background: #1a202c; color: #fff; padding: 18px 32px;
  display: flex; align-items: center; gap: 14px;
}
header h1 { font-size: 1.2rem; font-weight: 700; }
header span { font-size: 0.85rem; color: #a0aec0; }
.main { display: flex; gap: 0; min-height: calc(100vh - 60px); }

/* SIDEBAR */
.sidebar {
  width: 260px; flex-shrink: 0; background: #fff;
  border-right: 1px solid #e2e8f0; padding: 20px 0; position: sticky;
  top: 0; height: calc(100vh - 60px); overflow-y: auto;
}
.sidebar a {
  display: block; padding: 9px 24px; font-size: 0.85rem;
  color: #4a5568; text-decoration: none; cursor: pointer;
  border-left: 3px solid transparent;
}
.sidebar a:hover { background: #f7fafc; color: #2d3748; }
.sidebar a.active { border-left-color: #4299e1; color: #2b6cb0; background: #ebf8ff; font-weight: 600; }
.sidebar-sep { height: 1px; background: #e2e8f0; margin: 8px 16px; }

/* CONTENT */
.content { flex: 1; padding: 28px 32px; overflow-y: auto; }
.category { margin-bottom: 36px; }
.category h2 {
  font-size: 1rem; font-weight: 700; color: #2d3748;
  margin-bottom: 14px; padding-bottom: 8px;
  border-bottom: 2px solid #e2e8f0; display: flex; align-items: center; gap: 8px;
}
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card {
  background: #fff; border: 1px solid #e2e8f0; border-radius: 10px;
  padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
}
.card.danger { border-left: 4px solid #fc8181; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card-name { font-size: 0.88rem; font-weight: 700; color: #2d3748; }
.card-file { font-size: 0.72rem; color: #a0aec0; font-family: monospace; }
.card-desc { font-size: 0.83rem; color: #718096; line-height: 1.5; flex: 1; }
.btn-run {
  align-self: flex-end; padding: 7px 16px; border-radius: 7px; border: none;
  font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: opacity 0.15s;
}
.btn-run:hover { opacity: 0.85; }
.btn-run.normal { background: #4299e1; color: #fff; }
.btn-run.danger { background: #fc8181; color: #fff; }
.btn-run.launch { background: #48bb78; color: #fff; }
.btn-run:disabled { opacity: 0.4; cursor: not-allowed; }

/* CONSOLE */
.console-wrap {
  position: fixed; bottom: 0; left: 260px; right: 0;
  background: #1a202c; border-top: 2px solid #4299e1;
  transition: height 0.2s ease; height: 42px; z-index: 100;
}
.console-wrap.open { height: 260px; }
.console-header {
  display: flex; align-items: center; padding: 0 20px; height: 42px;
  cursor: pointer; user-select: none;
}
.console-header span { color: #a0aec0; font-size: 0.82rem; flex: 1; }
.console-header .toggle { color: #4299e1; font-size: 0.82rem; font-weight: 600; }
.console-header .running-badge {
  background: #f6ad55; color: #1a202c; font-size: 0.72rem; font-weight: 700;
  padding: 2px 8px; border-radius: 99px; margin-right: 10px; display: none;
}
.console-header .running-badge.visible { display: inline-block; }
#console-out {
  height: calc(260px - 42px); overflow-y: auto; padding: 8px 20px;
  font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 0.78rem;
  color: #e2e8f0; line-height: 1.6; display: none;
}
.console-wrap.open #console-out { display: block; }
.console-line.ok { color: #9ae6b4; }
.console-line.err { color: #fc8181; }
.console-line.end { color: #f6ad55; font-weight: 600; }

/* MODALE CONFIRMATION */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.visible { display: flex; }
.modal {
  background: #fff; border-radius: 14px; padding: 28px 32px;
  max-width: 420px; width: 90%; box-shadow: 0 8px 40px rgba(0,0,0,0.2);
}
.modal h3 { font-size: 1rem; color: #2d3748; margin-bottom: 10px; }
.modal p { font-size: 0.88rem; color: #718096; margin-bottom: 20px; line-height: 1.5; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }
.modal-actions button { padding: 8px 20px; border-radius: 7px; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
#modal-cancel { background: #e2e8f0; color: #4a5568; }
#modal-confirm { background: #4299e1; color: #fff; }
#modal-confirm.danger { background: #fc8181; }
</style>
</head>
<body>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-desc"></p>
    <div class="modal-actions">
      <button id="modal-cancel" onclick="closeModal()">Annuler</button>
      <button id="modal-confirm" onclick="confirmRun()">Confirmer</button>
    </div>
  </div>
</div>

<header>
  <div>🌿</div>
  <div>
    <h1>BDD Activités — Launcher</h1>
    <span>Gestion et maintenance de la base de données</span>
  </div>
</header>

<div class="main">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="content" id="content"></div>
</div>

<div class="console-wrap" id="console-wrap">
  <div class="console-header" onclick="toggleConsole()">
    <span id="console-title">▸ Console de sortie</span>
    <span class="running-badge" id="running-badge">⏳ En cours…</span>
    <span class="toggle" id="console-toggle">Ouvrir</span>
  </div>
  <div id="console-out"></div>
</div>

<script>
const CATEGORIES = [
  {
    id: "lancer",
    icon: "🚀",
    label: "Lancer l'application",
    scripts: [
      { file: "demarrer_app.bat", name: "Démarrer l'application", desc: "Lance le serveur FastAPI et ouvre l'interface principale dans le navigateur.", type: "launch", detached: true },
      { file: "demarrer_favoris.bat", name: "Sélection des favoris", desc: "Lance le serveur et ouvre l'interface de sélection des activités favorites.", type: "launch", detached: true },
    ]
  },
  {
    id: "analyse",
    icon: "🔍",
    label: "Analyse & enrichissement",
    scripts: [
      { file: "analyser_activites.bat", name: "Analyser les activités", desc: "Lit les fichiers _DESC_ via Gemini et remplit description, météo, thématiques et objectifs pour chaque activité.", type: "normal", confirm: true },
      { file: "analyser_attendus_v2.bat", name: "Analyser les attendus", desc: "Associe les attendus scolaires aux activités par cycle (C1/C2/C3). Configurer CYCLE dans le script avant lancement.", type: "normal", confirm: true },
      { file: "generer_desc_depuis_video.bat", name: "Générer DESC depuis vidéos", desc: "Upload les vidéos via l'API Gemini Files et génère automatiquement des fichiers _DESC_.txt.", type: "normal", confirm: true },
      { file: "lancer_traduction.bat", name: "Traduire les DESC anglais", desc: "Détecte les fichiers _DESC_ en anglais (langdetect + OCR) et génère des _DESC_FR_.docx via Gemini.", type: "normal", confirm: true },
      { file: "checker_desc_mixtes.bat", name: "Vérifier les DESC mixtes", desc: "Détecte les dossiers contenant à la fois des _DESC_ en français et en anglais.", type: "normal" },
    ]
  },
  {
    id: "integration",
    icon: "📥",
    label: "Intégration",
    scripts: [
      { file: "integrer_nouvelles_activites.bat", name: "Intégrer de nouvelles activités", desc: "Détecte les dossiers d'activités absents de la BDD et les intègre (description, cycles, attendus). Mode SIMULATION par défaut.", type: "normal", confirm: true },
      { file: "migrate_excel.bat", name: "Migrer depuis Excel", desc: "Importe les activités depuis le fichier Excel source vers la base SQLite.", type: "normal", confirm: true },
      { file: "importer_cycles_excel.bat", name: "Importer les cycles (Excel)", desc: "Lit l'Excel et marque les activités non prévues pour chaque cycle avec statut 'inadapte'.", type: "normal", confirm: true },
      { file: "renommer_videos_desc.bat", name: "Renommer les vidéos DESC", desc: "Renomme les fichiers vidéo _DESC_xxx.mp4 en xxx.mp4 après génération du _DESC_.txt. Mode SIMULATION par défaut.", type: "normal", confirm: true },
    ]
  },
  {
    id: "installation",
    icon: "🏗️",
    label: "Installation & migration",
    scripts: [
      { file: "create_schema.bat", name: "Créer le schéma BDD", desc: "Crée la base SQLite from scratch. À n'utiliser que lors d'une installation complète.", type: "normal", confirm: true },
      { file: "import_attendus_v2.bat", name: "Importer les attendus v2", desc: "Importe les ~350 attendus scolaires granulaires (C1/C2/C3, EDD + disciplinaires).", type: "normal", confirm: true },
      { file: "import_classification.bat", name: "Importer la classification", desc: "Importe les 298 thématiques et 19 objectifs pédagogiques.", type: "normal", confirm: true },
      { file: "import_pedagogies.bat", name: "Importer les pédagogies", desc: "Importe les 19 pédagogies, 9 théories et 4 cycles.", type: "normal", confirm: true },
    ]
  },
  {
    id: "utilitaires",
    icon: "🔧",
    label: "Utilitaires",
    scripts: [
      { file: "verifier_dossiers.bat", name: "Vérifier les dossiers", desc: "Vérifie que chaque activité en BDD a bien un dossier correspondant sur le disque.", type: "normal" },
      { file: "scanner_desc_types.bat", name: "Scanner les types de DESC", desc: "Parcourt les dossiers d'activités et classe les fichiers _DESC_ par type (vidéo, texte, image, aucun).", type: "normal" },
      { file: "outils/export_activites.bat", name: "Exporter les activités", desc: "Exporte nom, description et thématiques de toutes les activités vers un fichier Excel.", type: "normal", confirm: true },
      { file: "outils/attribuer_tag.bat", name: "Attribuer un tag", desc: "Crée un tag et l'attribue aux activités listées dans un fichier .txt. Mode SIMULATION par défaut.", type: "normal", confirm: true },
      { file: "outils/renommer_tag.bat", name: "Renommer un tag", desc: "Renomme un tag existant dans la base de données.", type: "normal", confirm: true },
      { file: "outils/deplacer_thematique.bat", name: "Déplacer une thématique", desc: "Déplace une thématique dans l'arborescence (change le parent, recalcule les niveaux). Mode SIMULATION par défaut.", type: "normal", confirm: true },
      { file: "outils/importer_anime.bat", name: "Importer les activités animées", desc: "Lit l'Excel et marque les activités avec anime=1 pour celles cochées 'Oui'.", type: "normal", confirm: true },
    ]
  },
  {
    id: "reinit",
    icon: "⚠️",
    label: "Réinitialisation",
    danger: true,
    scripts: [
      { file: "reinitialiser_attendus_v2.bat", name: "Réinitialiser les attendus", desc: "Vide toutes les associations attendus/cycles. Mode SIMULATION par défaut.", type: "danger", confirm: true },
      { file: "reinitialiser_associations.bat", name: "Réinitialiser les associations", desc: "Réinitialise les associations activité/cycle analysée.", type: "danger", confirm: true },
      { file: "reinitialiser_bdd.bat", name: "Réinitialiser la BDD", desc: "⚠️ Réinitialise entièrement la base de données. Action irréversible.", type: "danger", detached: true },
    ]
  },
];

// Construire la sidebar et le contenu
const sidebar = document.getElementById('sidebar');
const content = document.getElementById('content');

CATEGORIES.forEach(cat => {
  // Sidebar
  const a = document.createElement('a');
  a.textContent = cat.icon + ' ' + cat.label;
  a.href = '#' + cat.id;
  a.onclick = () => {
    document.querySelectorAll('.sidebar a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
  };
  sidebar.appendChild(a);

  // Section
  const section = document.createElement('div');
  section.className = 'category';
  section.id = cat.id;
  section.innerHTML = `<h2>${cat.icon} ${cat.label}</h2><div class="cards" id="cards-${cat.id}"></div>`;
  content.appendChild(section);

  const cardsDiv = document.getElementById('cards-' + cat.id);
  cat.scripts.forEach(s => {
    const card = document.createElement('div');
    card.className = 'card' + (s.type === 'danger' ? ' danger' : '');
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name">${s.name}</div>
          <div class="card-file">${s.file}</div>
        </div>
      </div>
      <div class="card-desc">${s.desc}</div>
      <button class="btn-run ${s.type}" onclick="handleRun('${s.file}', '${s.name}', ${!!s.detached}, ${!!s.confirm}, this)">
        ${s.detached ? '▶ Ouvrir' : '▶ Lancer'}
      </button>`;
    cardsDiv.appendChild(card);
  });
});

// Intersection observer pour la sidebar active
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      document.querySelectorAll('.sidebar a').forEach(a => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id);
      });
    }
  });
}, { threshold: 0.3 });
document.querySelectorAll('.category').forEach(s => observer.observe(s));

// Console
let consoleOpen = false;
function toggleConsole() {
  consoleOpen = !consoleOpen;
  document.getElementById('console-wrap').classList.toggle('open', consoleOpen);
  document.getElementById('console-toggle').textContent = consoleOpen ? 'Fermer' : 'Ouvrir';
}
function appendLine(text, cls) {
  const out = document.getElementById('console-out');
  const line = document.createElement('div');
  line.className = 'console-line ' + (cls || '');
  line.textContent = text;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}
function clearConsole() {
  document.getElementById('console-out').innerHTML = '';
}

// Modale de confirmation
let pendingRun = null;
function handleRun(file, name, detached, needsConfirm, btn) {
  if (!needsConfirm) { runScript(file, name, detached, btn); return; }
  pendingRun = { file, name, detached, btn };
  document.getElementById('modal-title').textContent = '▶ Lancer « ' + name + ' » ?';
  document.getElementById('modal-desc').textContent = 'Ce script va modifier des fichiers ou la base de données. Confirmer le lancement ?';
  const isDanger = btn.classList.contains('danger');
  document.getElementById('modal-confirm').className = isDanger ? 'danger' : '';
  document.getElementById('modal-overlay').classList.add('visible');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('visible');
  pendingRun = null;
}
function confirmRun() {
  closeModal();
  if (pendingRun) runScript(pendingRun.file, pendingRun.name, pendingRun.detached, pendingRun.btn);
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Lancer un script
let currentES = null;
function runScript(file, name, detached, btn) {
  if (detached) {
    fetch('/api/run', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({script: file}) });
    return;
  }

  if (currentES) currentES.close();
  clearConsole();
  if (!consoleOpen) toggleConsole();

  document.getElementById('console-title').textContent = '▸ ' + name;
  document.getElementById('running-badge').classList.add('visible');
  btn.disabled = true;
  appendLine('▶ Lancement de ' + file + '…', '');

  const es = new EventSource('/api/run?script=' + encodeURIComponent(file));
  currentES = es;

  // Pour SSE avec POST on doit passer par fetch + ReadableStream
  es.close();
  fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({script: file})
  }).then(resp => {
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    function read() {
      reader.read().then(({done, value}) => {
        if (done) { finish(); return; }
        buf += decoder.decode(value, {stream: true});
        const parts = buf.split('\n\n');
        buf = parts.pop();
        parts.forEach(p => {
          if (p.startsWith('data: ')) {
            const line = p.slice(6);
            if (line === '__END__') { finish(); return; }
            const cls = line.startsWith('[TERMINÉ') ? 'end' : line.toLowerCase().includes('erreur') ? 'err' : 'ok';
            appendLine(line, cls);
          }
        });
        read();
      });
    }
    read();
    function finish() {
      document.getElementById('running-badge').classList.remove('visible');
      btn.disabled = false;
    }
  });
}
</script>
</body>
</html>
