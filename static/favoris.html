<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sélection Favoris</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: #2d3748;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  #subtitle {
    font-size: 0.85rem;
    color: #718096;
    margin-bottom: 18px;
  }

  /* BARRE DE PROGRESSION */
  #progress-wrap {
    width: 100%;
    max-width: 680px;
    margin-bottom: 20px;
  }
  #progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #718096;
    margin-bottom: 6px;
  }
  #progress-bar-bg {
    background: #e2e8f0;
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }
  #progress-bar {
    background: linear-gradient(90deg, #48bb78, #38a169);
    height: 100%;
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  /* CARTE ACTIVITE */
  #card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 680px;
    padding: 32px 36px;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #card-nom {
    font-size: 1.35rem;
    font-weight: 700;
    color: #1a202c;
    line-height: 1.3;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .badge-lieu {
    background: #ebf4ff;
    color: #2b6cb0;
  }
  .badge-cycle-C1 { background: #fef3c7; color: #92400e; }
  .badge-cycle-C2 { background: #ede9fe; color: #5b21b6; }
  .badge-cycle-C3 { background: #fee2e2; color: #991b1b; }
  .badge-mois {
    background: #f0fff4;
    color: #276749;
  }
  .section-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #a0aec0;
    margin-bottom: 4px;
  }
  .section-text {
    font-size: 0.92rem;
    line-height: 1.6;
    color: #4a5568;
  }
  #card-desc-block, #card-obj-block {
    display: flex;
    flex-direction: column;
  }

  /* BOUTONS */
  #actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 8px;
    width: 100%;
    max-width: 680px;
  }
  .btn {
    flex: 1;
    max-width: 280px;
    padding: 16px 24px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn:active { transform: scale(0.97); }
  #btn-non {
    background: #fff5f5;
    color: #c53030;
    border: 2px solid #fed7d7;
  }
  #btn-non:hover { background: #fed7d7; box-shadow: 0 2px 12px rgba(197,48,48,0.12); }
  #btn-plus-tard {
    flex: 0 0 auto;
    max-width: 160px;
    background: #f7fafc;
    color: #718096;
    border: 2px solid #e2e8f0;
  }
  #btn-plus-tard:hover { background: #e2e8f0; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  #btn-oui {
    background: #f0fff4;
    color: #276749;
    border: 2px solid #c6f6d5;
  }
  #btn-oui:hover { background: #c6f6d5; box-shadow: 0 2px 12px rgba(39,103,73,0.12); }
  .btn .key-hint {
    font-size: 0.72rem;
    font-weight: 500;
    opacity: 0.6;
  }

  /* ETATS SPECIAUX */
  #loading, #done {
    display: none;
    text-align: center;
    padding: 40px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 680px;
  }
  #loading { font-size: 1rem; color: #718096; }
  #done { font-size: 1.1rem; color: #2d3748; }
  #done .done-icon { font-size: 3rem; margin-bottom: 12px; }
  #done p { margin-top: 8px; color: #718096; font-size: 0.88rem; }

  /* FLASH ANIMATION */
  @keyframes flash-green {
    0% { background: #fff; }
    30% { background: #f0fff4; }
    100% { background: #fff; }
  }
  @keyframes flash-red {
    0% { background: #fff; }
    30% { background: #fff5f5; }
    100% { background: #fff; }
  }
  .flash-oui { animation: flash-green 0.35s ease; }
  .flash-non { animation: flash-red 0.35s ease; }
</style>
</head>
<body>

<h1>⭐ Sélection des favoris</h1>
<div id="subtitle">Chargement en cours…</div>

<div id="progress-wrap" style="display:none">
  <div id="progress-info">
    <span id="progress-text"></span>
    <span id="stats-text"></span>
  </div>
  <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
</div>

<div id="loading">Chargement des activités…</div>

<div id="card" style="display:none">
  <div id="card-nom"></div>
  <div class="meta-row" id="card-meta"></div>
  <div id="card-desc-block">
    <div class="section-label">Description</div>
    <div class="section-text" id="card-desc">—</div>
  </div>
  <div id="card-obj-block">
    <div class="section-label">Visée pédagogique</div>
    <div class="section-text" id="card-obj">—</div>
  </div>
</div>

<div id="actions" style="display:none">
  <button class="btn" id="btn-non" onclick="decide('skip')">
    ✕ Écarter <span class="key-hint">← gauche</span>
  </button>
  <button class="btn" id="btn-plus-tard" onclick="plusTard()">
    ↓ Plus tard <span class="key-hint">↓ bas</span>
  </button>
  <button class="btn" id="btn-oui" onclick="decide('favori')">
    ✓ Favori <span class="key-hint">droite →</span>
  </button>
</div>

<div id="done">
  <div class="done-icon">🎉</div>
  <strong>Toutes les activités ont été consultées !</strong>
  <p id="done-stats"></p>
</div>

<script>
const MOIS_KEYS = ['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'];
const MOIS_NOMS = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

let session = {};          // {id_str: "favori"|"skip"}
let queue = [];            // activités à traiter
let current = 0;
let tagFavorisId = null;
let totalActivites = 0;
let isSaving = false;
let cyclesMap = {};        // {id_str: ["C1","C2",...] }

async function init() {
  document.getElementById('loading').style.display = 'block';

  // 1. Session existante
  const sessionData = await fetch('/api/favoris-session').then(r => r.json());
  session = sessionData.consulted || {};

  // 2. ID du tag _FAVORIS
  const tags = await fetch('/api/tags?q=_FAVORIS').then(r => r.json());
  const tag = tags.find(t => t.nom === '_FAVORIS');
  if (!tag) {
    document.getElementById('loading').textContent = 'Erreur : tag _FAVORIS introuvable en base.';
    return;
  }
  tagFavorisId = tag.id;

  // 3. Charger toutes les activités déjà taguées _FAVORIS -> marquer dans session
  let offset = 0;
  while (true) {
    const data = await fetch(`/api/activites?tag_ids=${tagFavorisId}&limit=200&offset=${offset}`).then(r => r.json());
    for (const a of data.results) {
      if (!session[String(a.id)]) session[String(a.id)] = 'favori';
    }
    offset += 200;
    if (offset >= data.total) break;
  }

  // 4. Charger la map cycles
  cyclesMap = await fetch('/api/activites-cycles-map').then(r => r.json());

  // 5. Charger toutes les activités
  const all = [];
  offset = 0;
  while (true) {
    const data = await fetch(`/api/activites?limit=200&offset=${offset}&sort=nom`).then(r => r.json());
    all.push(...data.results);
    totalActivites = data.total;
    offset += 200;
    if (offset >= data.total) break;
  }

  // 6. File d'attente = non consultées
  queue = all.filter(a => !session[String(a.id)]);
  current = 0;

  document.getElementById('loading').style.display = 'none';
  document.getElementById('subtitle').textContent =
    `${Object.keys(session).length} activités déjà traitées — ${queue.length} restantes`;

  renderCard();
}

function getMois(act) {
  return MOIS_KEYS
    .map((k, i) => act['mois_' + k] ? MOIS_NOMS[i] : null)
    .filter(Boolean);
}

function renderCard() {
  const total = queue.length;
  const done = current;
  const pct = total === 0 ? 100 : Math.round((done / total) * 100);

  const countFavoris = Object.values(session).filter(v => v === 'favori').length;
  const countSkip = Object.values(session).filter(v => v === 'skip').length;

  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total} consultées`;
  document.getElementById('stats-text').textContent = `⭐ ${countFavoris} favoris · ✕ ${countSkip} passées`;

  if (current >= queue.length) {
    document.getElementById('card').style.display = 'none';
    document.getElementById('actions').style.display = 'none';
    document.getElementById('done').style.display = 'block';
    document.getElementById('done-stats').textContent =
      `${countFavoris} favoris sélectionnés · ${countSkip} activités passées`;
    return;
  }

  const act = queue[current];
  document.getElementById('card-nom').textContent = act.nom;

  // Méta : lieu + mois
  const meta = document.getElementById('card-meta');
  meta.innerHTML = '';
  if (act.lieu) {
    const b = document.createElement('span');
    b.className = 'badge badge-lieu';
    b.textContent = '📍 ' + act.lieu;
    meta.appendChild(b);
  }
  const mois = getMois(act);
  if (mois.length > 0) {
    const b = document.createElement('span');
    b.className = 'badge badge-mois';
    b.textContent = '🗓 ' + mois.join(' · ');
    meta.appendChild(b);
  }
  const cycles = cyclesMap[String(act.id)] || [];
  for (const code of cycles) {
    const b = document.createElement('span');
    b.className = 'badge badge-cycle-' + code;
    b.textContent = code;
    meta.appendChild(b);
  }

  document.getElementById('card-desc').textContent = act.description || '(aucune description)';
  document.getElementById('card-obj').textContent = act.objectif_texte || '(aucune visée renseignée)';

  document.getElementById('card').style.display = 'flex';
  document.getElementById('actions').style.display = 'flex';
}

function plusTard() {
  if (isSaving) return;
  // Déplace l'activité en fin de file sans rien enregistrer
  const act = queue.splice(current, 1)[0];
  queue.push(act);
  renderCard();
}

async function decide(decision) {
  if (isSaving) return;
  isSaving = true;

  const act = queue[current];
  session[String(act.id)] = decision;

  // Animation flash
  const card = document.getElementById('card');
  card.classList.remove('flash-oui', 'flash-non');
  void card.offsetWidth;
  card.classList.add(decision === 'favori' ? 'flash-oui' : 'flash-non');

  // Assigner le tag si favori
  if (decision === 'favori') {
    try {
      const detail = await fetch(`/api/activites/${act.id}`).then(r => r.json());
      const currentTagIds = detail.tags.map(t => t.id);
      if (!currentTagIds.includes(tagFavorisId)) {
        await fetch(`/api/activites/${act.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tag_ids: [...currentTagIds, tagFavorisId] })
        });
      }
    } catch (e) {
      console.error('Erreur attribution tag :', e);
    }
  }

  // Sauvegarder session
  await fetch('/api/favoris-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ consulted: session, last_updated: new Date().toISOString() })
  });

  current++;
  isSaving = false;
  renderCard();
}

// Raccourcis clavier
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  decide('skip');
  if (e.key === 'ArrowRight') decide('favori');
  if (e.key === 'ArrowDown')  plusTard();
});

init();
</script>
</body>
</html>
