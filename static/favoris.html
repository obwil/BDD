<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sélection Favoris</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    color: #2d3748;
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }
  #subtitle {
    font-size: 0.85rem;
    color: #718096;
    margin-bottom: 18px;
  }

  /* ONGLETS MODE */
  #mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
    width: 100%;
    max-width: 680px;
  }
  .mode-tab {
    flex: 1;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    background: #fff;
    color: #718096;
    text-align: center;
    transition: all 0.15s;
    user-select: none;
  }
  .mode-tab:hover { border-color: #cbd5e0; color: #4a5568; }
  .mode-tab.active-non-traite {
    background: #edf2f7;
    border-color: #a0aec0;
    color: #2d3748;
  }
  .mode-tab.active-favori {
    background: #f0fff4;
    border-color: #9ae6b4;
    color: #276749;
  }
  .mode-tab.active-ecarte {
    background: #fff5f5;
    border-color: #feb2b2;
    color: #c53030;
  }

  /* BARRE DE PROGRESSION */
  #progress-wrap {
    width: 100%;
    max-width: 680px;
    margin-bottom: 20px;
  }
  #progress-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: #718096;
    margin-bottom: 6px;
  }
  #progress-bar-bg {
    background: #e2e8f0;
    border-radius: 99px;
    height: 8px;
    overflow: hidden;
  }
  #progress-bar {
    background: linear-gradient(90deg, #48bb78, #38a169);
    height: 100%;
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  /* CARTE ACTIVITE */
  #card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 680px;
    padding: 32px 36px;
    min-height: 340px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  #card-nom {
    font-size: 1.35rem;
    font-weight: 700;
    color: #1a202c;
    line-height: 1.3;
  }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .badge-lieu {
    background: #ebf4ff;
    color: #2b6cb0;
  }
  .badge-cycle-C1 { background: #fef3c7; color: #92400e; }
  .badge-cycle-C2 { background: #ede9fe; color: #5b21b6; }
  .badge-cycle-C3 { background: #fee2e2; color: #991b1b; }
  .badge-folder {
    background: #fefcbf; color: #744210;
    text-decoration: none; cursor: pointer;
  }
  .badge-folder:hover { background: #faf089; }
  .badge-mois {
    background: #f0fff4;
    color: #276749;
  }
  .section-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: #a0aec0;
    margin-bottom: 4px;
  }
  .section-text {
    font-size: 0.92rem;
    line-height: 1.6;
    color: #4a5568;
  }
  #card-desc-block, #card-obj-block {
    display: flex;
    flex-direction: column;
  }

  /* BOUTONS */
  #actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-top: 8px;
    width: 100%;
    max-width: 680px;
  }
  .btn {
    flex: 1;
    max-width: 280px;
    padding: 16px 24px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .btn:active { transform: scale(0.97); }
  #btn-non {
    background: #fff5f5;
    color: #c53030;
    border: 2px solid #fed7d7;
  }
  #btn-non:hover { background: #fed7d7; box-shadow: 0 2px 12px rgba(197,48,48,0.12); }
  #btn-plus-tard {
    flex: 0 0 auto;
    max-width: 160px;
    background: #f7fafc;
    color: #718096;
    border: 2px solid #e2e8f0;
  }
  #btn-plus-tard:hover { background: #e2e8f0; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  #btn-oui {
    background: #f0fff4;
    color: #276749;
    border: 2px solid #c6f6d5;
  }
  #btn-oui:hover { background: #c6f6d5; box-shadow: 0 2px 12px rgba(39,103,73,0.12); }
  .btn .key-hint {
    font-size: 0.72rem;
    font-weight: 500;
    opacity: 0.6;
  }

  /* ETATS SPECIAUX */
  #loading, #done {
    display: none;
    text-align: center;
    padding: 40px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    width: 100%;
    max-width: 680px;
  }
  #loading { font-size: 1rem; color: #718096; }
  #done { font-size: 1.1rem; color: #2d3748; }
  #done .done-icon { font-size: 3rem; margin-bottom: 12px; }
  #done p { margin-top: 8px; color: #718096; font-size: 0.88rem; }

  /* FLASH ANIMATION */
  @keyframes flash-green {
    0% { background: #fff; }
    30% { background: #f0fff4; }
    100% { background: #fff; }
  }
  @keyframes flash-red {
    0% { background: #fff; }
    30% { background: #fff5f5; }
    100% { background: #fff; }
  }
  .flash-oui { animation: flash-green 0.35s ease; }
  .flash-non { animation: flash-red 0.35s ease; }
</style>
</head>
<body>

<h1>⭐ Sélection des favoris</h1>
<div id="subtitle">Chargement en cours…</div>

<div id="mode-tabs" style="display:none">
  <div class="mode-tab" id="tab-non-traite" onclick="switchMode('non-traite')">
    ⬜ Non traitées<br><small id="count-non-traite">—</small>
  </div>
  <div class="mode-tab" id="tab-favori" onclick="switchMode('favori')">
    ⭐ Sélectionnées<br><small id="count-favori">—</small>
  </div>
  <div class="mode-tab" id="tab-ecarte" onclick="switchMode('ecarte')">
    ✕ Écartées<br><small id="count-ecarte">—</small>
  </div>
</div>

<div id="progress-wrap" style="display:none">
  <div id="progress-info">
    <span id="progress-text"></span>
    <span id="stats-text"></span>
  </div>
  <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
</div>

<div id="loading">Chargement des activités…</div>

<div id="card" style="display:none">
  <div id="card-nom"></div>
  <div class="meta-row" id="card-meta"></div>
  <div id="card-desc-block">
    <div class="section-label">Description</div>
    <div class="section-text" id="card-desc">—</div>
  </div>
  <div id="card-obj-block">
    <div class="section-label">Visée pédagogique</div>
    <div class="section-text" id="card-obj">—</div>
  </div>
</div>

<div id="actions" style="display:none">
  <button class="btn" id="btn-non"></button>
  <button class="btn" id="btn-plus-tard" onclick="plusTard()">
    ↓ Plus tard <span class="key-hint">↓ bas</span>
  </button>
  <button class="btn" id="btn-oui"></button>
</div>

<div id="done">
  <div class="done-icon" id="done-icon">🎉</div>
  <strong id="done-title">Toutes les activités ont été consultées !</strong>
  <p id="done-stats"></p>
</div>

<script>
const MOIS_KEYS = ['jan','fev','mar','avr','mai','jun','jul','aou','sep','oct','nov','dec'];
const MOIS_NOMS = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];

let session = {};
let allActivites = [];
let queue = [];
let current = 0;
let tagFavorisId = null;
let isSaving = false;
let cyclesMap = {};

// Mode courant : 'non-traite' | 'favori' | 'ecarte'
let currentMode = 'non-traite';

async function init() {
  document.getElementById('loading').style.display = 'block';

  const sessionData = await fetch('/api/favoris-session').then(r => r.json());
  session = sessionData.consulted || {};

  const tags = await fetch('/api/tags?q=_FAVORIS').then(r => r.json());
  const tag = tags.find(t => t.nom === '_FAVORIS');
  if (!tag) {
    document.getElementById('loading').textContent = 'Erreur : tag _FAVORIS introuvable en base.';
    return;
  }
  tagFavorisId = tag.id;

  // Charger les activités déjà taguées _FAVORIS → marquer dans session
  let offset = 0;
  while (true) {
    const data = await fetch(`/api/activites?tag_ids=${tagFavorisId}&limit=200&offset=${offset}`).then(r => r.json());
    for (const a of data.results) {
      if (!session[String(a.id)]) session[String(a.id)] = 'favori';
    }
    offset += 200;
    if (offset >= data.total) break;
  }

  cyclesMap = await fetch('/api/activites-cycles-map').then(r => r.json());

  // Charger toutes les activités
  offset = 0;
  while (true) {
    const data = await fetch(`/api/activites?limit=200&offset=${offset}&sort=nom`).then(r => r.json());
    allActivites.push(...data.results);
    offset += 200;
    if (offset >= data.total) break;
  }

  allActivites.forEach(a => {
    if (a.chemin_dossier) a.chemin_dossier = a.chemin_dossier.replace('file:///', '');
  });

  document.getElementById('loading').style.display = 'none';
  document.getElementById('mode-tabs').style.display = 'flex';

  switchMode('non-traite');
}

function getQueue(mode) {
  if (mode === 'non-traite') return allActivites.filter(a => !session[String(a.id)]);
  if (mode === 'favori')     return allActivites.filter(a => session[String(a.id)] === 'favori');
  if (mode === 'ecarte')     return allActivites.filter(a => session[String(a.id)] === 'skip');
  return [];
}

function updateTabCounts() {
  document.getElementById('count-non-traite').textContent = getQueue('non-traite').length + ' activités';
  document.getElementById('count-favori').textContent     = getQueue('favori').length + ' activités';
  document.getElementById('count-ecarte').textContent     = getQueue('ecarte').length + ' activités';
}

function switchMode(mode) {
  currentMode = mode;
  queue = getQueue(mode);
  current = 0;

  // Onglet actif
  ['non-traite','favori','ecarte'].forEach(m => {
    const tab = document.getElementById('tab-' + m);
    tab.className = 'mode-tab' + (m === mode ? ' active-' + m : '');
  });

  // Couleur barre de progression selon mode
  const bar = document.getElementById('progress-bar');
  if (mode === 'favori') bar.style.background = 'linear-gradient(90deg, #48bb78, #38a169)';
  else if (mode === 'ecarte') bar.style.background = 'linear-gradient(90deg, #fc8181, #e53e3e)';
  else bar.style.background = 'linear-gradient(90deg, #63b3ed, #3182ce)';

  // Boutons selon mode
  const btnNon = document.getElementById('btn-non');
  const btnOui = document.getElementById('btn-oui');
  const btnPlusTard = document.getElementById('btn-plus-tard');

  if (mode === 'non-traite') {
    btnNon.innerHTML = '✕ Écarter <span class="key-hint">← gauche</span>';
    btnNon.onclick = () => decide('skip');
    btnOui.innerHTML = '✓ Favori <span class="key-hint">droite →</span>';
    btnOui.onclick = () => decide('favori');
    btnPlusTard.style.display = '';
  } else if (mode === 'favori') {
    btnNon.innerHTML = '✕ Écarter <span class="key-hint">← gauche</span>';
    btnNon.onclick = () => decide('skip');
    btnOui.innerHTML = '⭐ Maintenir favori <span class="key-hint">droite →</span>';
    btnOui.onclick = () => decide('favori');
    btnPlusTard.style.display = '';
  } else if (mode === 'ecarte') {
    btnNon.innerHTML = '✕ Maintenir écarté <span class="key-hint">← gauche</span>';
    btnNon.onclick = () => decide('skip');
    btnOui.innerHTML = '⭐ Sélectionner <span class="key-hint">droite →</span>';
    btnOui.onclick = () => decide('favori');
    btnPlusTard.style.display = '';
  }

  updateTabCounts();
  updateSubtitle();
  renderCard();
}

function updateSubtitle() {
  const countFavoris = Object.values(session).filter(v => v === 'favori').length;
  const countSkip    = Object.values(session).filter(v => v === 'skip').length;
  const countNon     = allActivites.length - countFavoris - countSkip;
  document.getElementById('subtitle').textContent =
    `⭐ ${countFavoris} favoris · ✕ ${countSkip} écartées · ⬜ ${countNon} non traitées`;
}

function getMois(act) {
  return MOIS_KEYS
    .map((k, i) => act['mois_' + k] ? MOIS_NOMS[i] : null)
    .filter(Boolean);
}

function renderCard() {
  const total = queue.length;
  const done  = current;
  const pct   = total === 0 ? 100 : Math.round((done / total) * 100);

  document.getElementById('progress-wrap').style.display = 'block';
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${total}`;
  document.getElementById('stats-text').textContent = '';

  if (current >= queue.length) {
    document.getElementById('card').style.display = 'none';
    document.getElementById('actions').style.display = 'none';
    document.getElementById('done').style.display = 'block';

    if (currentMode === 'non-traite') {
      document.getElementById('done-icon').textContent = '🎉';
      document.getElementById('done-title').textContent = 'Toutes les activités ont été consultées !';
      document.getElementById('done-stats').textContent =
        `${Object.values(session).filter(v=>v==='favori').length} favoris · ${Object.values(session).filter(v=>v==='skip').length} écartées`;
    } else if (currentMode === 'favori') {
      document.getElementById('done-icon').textContent = '⭐';
      document.getElementById('done-title').textContent = 'Toutes les activités sélectionnées ont été passées en revue.';
      document.getElementById('done-stats').textContent = '';
    } else {
      document.getElementById('done-icon').textContent = '✕';
      document.getElementById('done-title').textContent = 'Toutes les activités écartées ont été passées en revue.';
      document.getElementById('done-stats').textContent = '';
    }
    return;
  }

  document.getElementById('done').style.display = 'none';

  const act = queue[current];
  document.getElementById('card-nom').textContent = act.nom;

  const meta = document.getElementById('card-meta');
  meta.innerHTML = '';
  const bLieu = document.createElement('span');
  bLieu.className = 'badge badge-lieu';
  bLieu.textContent = '📍 ' + (act.lieu || 'Lieu non précisé');
  meta.appendChild(bLieu);

  if (act.chemin_dossier) {
    const link = document.createElement('a');
    link.className = 'badge badge-folder';
    link.textContent = '📁 Ouvrir le dossier';
    link.href = '#';
    link.onclick = e => { e.preventDefault(); fetch('/api/open-folder?path=' + encodeURIComponent(act.chemin_dossier)); };
    meta.appendChild(link);
  }
  const mois = getMois(act);
  if (mois.length > 0) {
    const b = document.createElement('span');
    b.className = 'badge badge-mois';
    b.textContent = '🗓 ' + mois.join(' · ');
    meta.appendChild(b);
  }
  const cycles = cyclesMap[String(act.id)] || [];
  for (const code of cycles) {
    const b = document.createElement('span');
    b.className = 'badge badge-cycle-' + code;
    b.textContent = code;
    meta.appendChild(b);
  }

  document.getElementById('card-desc').textContent = act.description || '(aucune description)';
  document.getElementById('card-obj').textContent  = act.objectif_texte || '(aucune visée renseignée)';

  document.getElementById('card').style.display    = 'flex';
  document.getElementById('actions').style.display = 'flex';
}

function plusTard() {
  if (isSaving) return;
  const act = queue.splice(current, 1)[0];
  queue.push(act);
  renderCard();
}

async function decide(decision) {
  if (isSaving) return;
  isSaving = true;

  const act = queue[current];
  const prevDecision = session[String(act.id)];
  session[String(act.id)] = decision;

  // Flash
  const card = document.getElementById('card');
  card.classList.remove('flash-oui', 'flash-non');
  void card.offsetWidth;
  card.classList.add(decision === 'favori' ? 'flash-oui' : 'flash-non');

  // Gestion du tag _FAVORIS
  const becomesFavori = decision === 'favori' && prevDecision !== 'favori';
  const loseFavori    = decision !== 'favori' && prevDecision === 'favori';

  if (becomesFavori || loseFavori) {
    try {
      const detail = await fetch(`/api/activites/${act.id}`).then(r => r.json());
      const currentTagIds = detail.tags.map(t => t.id);
      let newTagIds;
      if (becomesFavori) {
        newTagIds = currentTagIds.includes(tagFavorisId)
          ? currentTagIds
          : [...currentTagIds, tagFavorisId];
      } else {
        newTagIds = currentTagIds.filter(id => id !== tagFavorisId);
      }
      await fetch(`/api/activites/${act.id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tag_ids: newTagIds })
      });
    } catch (e) {
      console.error('Erreur tag :', e);
    }
  }

  await fetch('/api/favoris-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ consulted: session, last_updated: new Date().toISOString() })
  });

  // Dans les modes favori/ecarte : retirer la carte de la queue si la décision a changé
  if (currentMode !== 'non-traite' && decision !== prevDecision) {
    queue.splice(current, 1);
    // current reste le même (pointe sur la carte suivante)
  } else {
    current++;
  }

  updateTabCounts();
  updateSubtitle();
  isSaving = false;
  renderCard();
}

// Raccourcis clavier
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  document.getElementById('btn-non').click();
  if (e.key === 'ArrowRight') document.getElementById('btn-oui').click();
  if (e.key === 'ArrowDown')  plusTard();
});

init();
</script>
</body>
</html>
